---
layout: default
---
<article class="page wrap wrap--read">
  <header class="page-head">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.description and page.description != "" %}<p class="page-dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {% include prefix-links.html html=content %}
  </div>
</article>
