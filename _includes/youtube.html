{%- comment -%}
  Embedded YouTube video (privacy-friendly youtube-nocookie domain, lazy-loaded).
    {% include youtube.html id="VIDEO_ID" title="What the video is about" %}
  The id is the part after  v=  in the video's address.
{%- endcomment -%}
<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | default: 'YouTube video' | escape }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
