<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb__btn lb__close" type="button" aria-label="Close (Esc)">{% include icon.html name="close" %}</button>
  <button class="lb__btn lb__prev" type="button" aria-label="Previous image (Left arrow)">{% include icon.html name="arrow-left" %}</button>
  <button class="lb__btn lb__next" type="button" aria-label="Next image (Right arrow)">{% include icon.html name="arrow-right" %}</button>
  <figure class="lb__stage">
    <div class="lb__imgwrap"><img class="lb__img" alt=""></div>
    <figcaption class="lb__info">
      <p class="lb__caption"></p>
      <p class="lb__meta"></p>
    </figcaption>
  </figure>
  <p class="lb__count" aria-live="polite"></p>
</div>
