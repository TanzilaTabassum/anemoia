{%- comment -%} A row of tag links that open the search page pre-filtered. Param: tags (array) {%- endcomment -%}
{%- if include.tags and include.tags.size > 0 -%}
<ul class="tags" aria-label="Tags">
  {%- for t in include.tags %}
  <li><a class="tag" href="{{ '/search/' | relative_url }}?tag={{ t | url_encode }}"><span aria-hidden="true">#</span>{{ t | replace: '-', ' ' }}</a></li>
  {%- endfor %}
</ul>
{%- endif -%}
