# ─────────────────────────────────────────────────────────────────────
#  ANEMOIA — Pages CMS configuration
#
#  This file only tells the Pages CMS dashboard (app.pagescms.org) which
#  folders and fields to show you. It does NOT change how the website
#  looks or works. If you delete it, the website is unaffected.
#
#  It is public (like every file in this repository). It contains no
#  passwords or keys — signing in happens on GitHub, never in this file.
# ─────────────────────────────────────────────────────────────────────

# Where pictures you upload through the CMS are saved, and how they are
# written into your pages.
#   input  = the folder in the repository
#   output = the address written into the page (starts with / )
media:
  input: assets/images/uploads
  output: /assets/images/uploads
  rename: safe                      # "My Photo (1).JPG" -> "my-photo-1.jpg"
  extensions: [jpg, jpeg, png, webp, gif]

content:

  # ── Art ────────────────────────────────────────────────────────────
  - name: art
    label: Art
    type: collection
    path: _art
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date finished, type: date, format: "yyyy-MM-dd", required: true }
      - { name: medium, label: "Medium (e.g. Acrylic on canvas)", type: string }
      - { name: dimensions, label: "Size (e.g. 60 × 80 cm) - optional", type: string }
      - { name: description, label: "One-sentence summary (cards and search)", type: text }
      - { name: published, label: "Published (switch OFF to hide it from the site)", type: boolean, default: true }
      - { name: featured, label: "Show on the homepage Featured section", type: boolean }
      - { name: featured_order, label: "Featured order (1 = first) - optional", type: number }
      - { name: tags, label: "Tags (lowercase, hyphens: oil-pastel)", type: string, list: true }
      - { name: image, label: Main image, type: image }
      - { name: alt, label: "Image description for screen readers (required)", type: text }
      - name: process_images
        label: "Process photos (optional) - sketches, stages, details"
        type: object
        list: true
        fields:
          - { name: file, label: Image, type: image }
          - { name: label, label: "Short label (Sketch, Detail...)", type: string }
          - { name: caption, label: Caption, type: string }
          - { name: alt, label: Image description, type: string }
      - { name: related, label: "Related pieces (optional) - one file path each, e.g. _art/my-piece.md", type: string, list: true }
      - { name: body, label: "Artist's note", type: rich-text }

  # ── Photography ────────────────────────────────────────────────────
  - name: photography
    label: Photography series
    type: collection
    path: _photography
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: Series title, type: string, required: true }
      - { name: date, label: Date, type: date, format: "yyyy-MM-dd", required: true }
      - { name: location, label: Location, type: string }
      - { name: description, label: "Short introduction (cards and search)", type: text }
      - { name: published, label: "Published (switch OFF to hide it from the site)", type: boolean, default: true }
      - { name: featured, label: "Show on the homepage Featured section", type: boolean }
      - { name: featured_order, label: "Featured order (1 = first) - optional", type: number }
      - { name: tags, label: "Tags (lowercase, hyphens)", type: string, list: true }
      - name: images
        label: "Photos (the FIRST one is the big opening photo)"
        type: object
        list: true
        fields:
          - { name: file, label: Photo, type: image }
          - { name: alt, label: "Description for screen readers (required)", type: string }
          - { name: caption, label: Caption, type: string }
          - { name: location, label: "Place for this photo - optional", type: string }
          - { name: shape, label: "Layout - optional (wide | tall | half | third)", type: select, options: { values: [wide, tall, half, third] } }
      - { name: related, label: "Related pieces (optional) - one file path each", type: string, list: true }
      - { name: body, label: "Longer note about the series (optional)", type: rich-text }

  # ── Writing: essays, life pieces and reviews ───────────────────────
  - name: writing
    label: Writing (essays, life, reviews)
    type: collection
    path: _writing
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string }
      - { name: type, label: "Kind of writing (essay | life | review)", type: select, options: { values: [essay, life, review] }, required: true }
      - { name: date, label: Date published, type: date, format: "yyyy-MM-dd", required: true }
      - { name: updated, label: "Date last updated - optional", type: date, format: "yyyy-MM-dd", default: "" }
      - { name: description, label: "One or two sentences (index, cards, search)", type: text }
      - { name: published, label: "Published (switch OFF to hide it from the site)", type: boolean, default: true }
      - { name: featured, label: "Show on the homepage Featured section", type: boolean }
      - { name: featured_order, label: "Featured order (1 = first) - optional", type: number }
      - { name: tags, label: "Tags (lowercase, hyphens)", type: string, list: true }
      - { name: cover_image, label: Cover image, type: image }
      - { name: cover_alt, label: "Cover description for screen readers", type: string }
      - { name: cover_caption, label: "Cover caption - optional", type: string }
      - { name: reading_time, label: "Reading time in minutes - optional (otherwise automatic)", type: number }
      - { name: subject, label: "Tag that drives 'More from...' - optional", type: string }
      - { name: related, label: "Related pieces (optional) - one file path each", type: string, list: true }
      - { name: body, label: Text, type: rich-text }

  # ── Side quests ────────────────────────────────────────────────────
  - name: sidequests
    label: Side quests
    type: collection
    path: _sidequests
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: [".gitkeep"]
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - { name: title, label: Quest title, type: string, required: true }
      - { name: date, label: Start date, type: date, format: "yyyy-MM-dd", required: true }
      - { name: end_date, label: "End date - optional", type: date, format: "yyyy-MM-dd", default: "" }
      - { name: status, label: Status, type: select, options: { values: [in-progress, completed, failed, abandoned, paused] } }
      - { name: description, label: "One sentence: what was the quest?", type: text }
      - { name: published, label: "Published (switch OFF to hide it from the site)", type: boolean, default: true }
      - { name: featured, label: "Show on the homepage Featured section", type: boolean }
      - { name: featured_order, label: "Featured order (1 = first) - optional", type: number }
      - { name: tags, label: "Tags (lowercase, hyphens)", type: string, list: true }
      - { name: cover_image, label: Banner / cover image, type: image }
      - { name: cover_alt, label: "Cover description for screen readers", type: string }
      - name: log
        label: "Quest log panel (optional): Goal, Budget, Tools..."
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - { name: result, label: "Final reflection / result - optional", type: text }
      - { name: lessons, label: "Lessons learned (one each) - optional", type: string, list: true }
      - { name: related, label: "Related pieces (optional) - one file path each", type: string, list: true }
      - { name: body, label: Journal, type: rich-text }

  # ── About page ─────────────────────────────────────────────────────
  - name: about
    label: About page
    type: file
    path: about/index.md
    format: yaml-frontmatter
    fields:
      - { name: layout, label: Layout (leave alone), type: string, hidden: true }
      - { name: styles, label: Styles (leave alone), type: string, list: true, hidden: true }
      - { name: title, label: Page title, type: string }
      - { name: eyebrow, label: Small line above the title, type: string }
      - { name: description, label: Short description, type: text }
      - { name: body, label: Text, type: rich-text }

  # ── Footer + Contact links ─────────────────────────────────────────
  - name: links
    label: "Links (footer + Contact page)"
    type: file
    path: _data/social.yml
    format: yaml
    list: true
    fields:
      - { name: label, label: Name (Substack, YouTube...), type: string }
      - { name: url, label: "Address - starts with https:// (email: mailto:you@example.com). Empty = hidden", type: string }
      - { name: note, label: Small note, type: string }

  # ── "Right now" box on the homepage ────────────────────────────────
  - name: currently
    label: '"Right now" box (homepage)'
    type: file
    path: _data/currently.yml
    format: yaml
    fields:
      - { name: updated, label: "Last updated", type: date, format: "yyyy-MM-dd" }
      - name: items
        label: "Lines (leave the list empty to hide the box)"
        type: object
        list: true
        fields:
          - { name: label, label: "Label (Reading, Making...)", type: string }
          - { name: text, label: Text, type: string }
